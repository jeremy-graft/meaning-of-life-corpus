# Multilingual seams — the cross-cultural map of meaning.
#
# WHY: config/seeds.yaml is English-only. That corpus doesn't tell us what
# humanity thinks life means; it tells us what ANGLOPHONE YouTube thinks. The
# 44% religion share is partly just "English-speaking, death-adjacent internet."
# Running the SAME human thresholds in other languages is the one expansion that
# produces genuinely new knowledge rather than sharper decimal places.
#
# DESIGN: `name` (the seam) is shared across languages on purpose — genre_seed
# stays the same human threshold, `lang` carries the culture. Slice by
# (genre_seed x lang) to ask: does freedom still win the sobriety seam in Japan?
# Does family beat faith in Brazil?
#
# This file is ADDITIVE — it deliberately omits the English variants of seams
# already collected in seeds.yaml, so no quota is wasted re-scraping them.
# New seams (bottom) DO include English, because that's new ground too.
#
# Quota: each (seam x language) run costs ~220 units (1 search=100, 30 videos=30,
# ~90 comment pages). Daily quota is 10,000 → ~43 runs/day. This file is ~62 runs
# ≈ 2 days. `collect` fails soft on quota exhaustion and is idempotent, so just
# re-run it daily until it stops adding items.

defaults:
  max_videos: 30
  comments_per_video: 300
  collect_descriptions: true
  collect_comments: true
  collect_transcripts: false   # IP-blocks; use the throttled refetch-transcripts pass
  order: relevance

seams:
  # ---- existing seams, NEW languages (English already collected) ----
  - name: last_words_hospice
    queries:
      es: "enfermera de cuidados paliativos qué dicen los pacientes antes de morir"
      pt: "enfermeira de cuidados paliativos o que os pacientes dizem antes de morrer"
      hi: "मृत्यु से पहले मरीज़ क्या कहते हैं नर्स अनुभव"
      ar: "ماذا يقول المرضى قبل الموت ممرضة رعاية"
      id: "perawat hospice apa yang dikatakan pasien sebelum meninggal"
      ja: "ホスピス 看護師 患者が亡くなる前に言う言葉"
      tr: "hospis hemşiresi hastalar ölmeden önce ne söyler"

  - name: near_death_experience
