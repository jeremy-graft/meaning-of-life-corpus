# Wave 3 — closing the seam gap, not adding languages.
#
# Wave 1 gave eight languages (ar en es hi id ja pt tr) fourteen seams.
# Wave 2 gave ten more languages (de fa fr ko pl ru sw th tl vi) only eight.
# So for more than half the map, six thresholds have never been asked at all:
#
#   bankruptcy_ruin            losing everything you built
#   coming_out                 telling your family who you are
#   infertility_journey        wanting a child and not having one
#   leaving_a_cult             walking out of a group that owned your answers
#   natural_disaster_survivor  the house gone in a night
#   refugee_displacement       forced out of the country itself
#
# These are not filler. Four of them are thresholds the existing seams cannot
# reach:
#
#   - leaving_a_cult is the only seam where a person describes a meaning being
#     TAKEN AWAY and replaced. faith_crisis is doubt from the inside; this is
#     the aftermath of exit.
#   - refugee_displacement separates losing a PLACE from losing a person, which
#     every grief seam conflates. It also reaches populations that no other
#     seam here touches: Persian, Ukrainian-adjacent Russian, Swahili.
#   - infertility_journey is the mirror of new_parent_first_child, which is one
#     of the three biggest seams in the corpus. Having the absence beside the
#     presence makes family_children testable rather than assumed.
#   - bankruptcy_ruin is the secular ruin seam. Everything else that strips a
#     person bare here is illness or death.
#
# 6 seams x 10 languages = 60 runs, roughly 1.5 quota-days. Seam names match
# wave 1 exactly so the cross-cultural tables need no new code.
#
# A note on two of these. coming_out and leaving_a_cult reach people who are at
# real risk in some of these countries. The pipeline's existing protections are
# what make this acceptable: author handles are hashed at ingest and the
# originals are never stored, no text is published, and the released dataset is
# ids and labels only. Nothing collected here can be linked back to a person by
# anyone reading the output.

defaults:
  max_videos: 30
  comments_per_video: 300
  collect_descriptions: true
  collect_comments: true
  collect_transcripts: false
  order: relevance

seams:
  - name: bankruptcy_ruin
    queries:
      ru: "потерял бизнес банкротство что понял о жизни"
      de: "Insolvenz alles verloren was im Leben wirklich zählt"
      fr: "faillite tout perdu ce qui compte vraiment dans la vie"
      ko: "파산하고 모든 것을 잃은 뒤 깨달은 것"
      vi: "phá sản mất tất cả tôi nhận ra điều gì quan trọng"
      th: "ล้มละลาย สูญเสียทุกอย่าง สิ่งที่ได้เรียนรู้จากชีวิต"
      fa: "ورشکستگی همه چیز را از دست دادم چه فهمیدم"
      sw: "nilipoteza biashara yangu yote nilijifunza nini maishani"
      pl: "bankructwo straciłem wszystko czego mnie to nauczyło"
      tl: "nalugi nawala lahat ano ang natutunan ko sa buhay"

  - name: coming_out
