      ko: "호스피스 간호사 임종 환자가 남긴 말"
      vi: "y tá chăm sóc cuối đời bệnh nhân nói gì trước khi mất"
      th: "พยาบาลดูแลผู้ป่วยระยะสุดท้าย ผู้ป่วยพูดอะไรก่อนตาย"
      fa: "پرستار آسایشگاه بیماران قبل از مرگ چه می‌گویند"
      sw: "muuguzi wa wagonjwa mahututi wanasema nini kabla ya kufa"
