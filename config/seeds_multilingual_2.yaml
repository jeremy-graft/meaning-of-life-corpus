# Wave 2 languages — chosen to fill the MAP'S GAPS, not just add volume.
#
# The current map (ar 70% religion ... ja 11%) has real holes:
#   - AFRICA: entirely absent            -> sw (Swahili, Christian/Muslim East Africa)
#   - BUDDHIST-majority: absent          -> th, vi  (Japan is secular, not practising-Buddhist)
#   - ORTHODOX Christianity: absent      -> ru
#   - SHIA Islam: absent (ar is Sunni-weighted) -> fa
#   - CHRISTIAN Asia: absent             -> ko (the sharpest possible control on Japan:
#                                            same region, same modernity, very different faith)
#   - SECULAR Europe                     -> de, fr
#   - DEVOUT Catholic Europe / Asia      -> pl, tl
#
# ko-vs-ja is the single most valuable pair here: if Korea comes back religious and
# Japan stays at 11%, "East Asian modernity" is ruled out as the explanation and the
# Japan result becomes specifically about Japan.
#
# 8 seams x 10 languages = 80 runs ~= 2 quota-days. Same seam names as wave 1, so
# everything slots straight into the existing cross-cultural comparison.

defaults:
  max_videos: 30
  comments_per_video: 300
  collect_descriptions: true
  collect_comments: true
  collect_transcripts: false
  order: relevance

seams:
  - name: last_words_hospice
    queries:
      ru: "медсестра хосписа что говорят умирающие перед смертью"
      de: "Hospiz Pflegerin was Sterbende kurz vor dem Tod sagen"
